name: CI

on:
  pull_request:
  push:
    branches: [claude/all-in-one-business-platform-haud19]

# A new push to a branch makes the run already in flight for it irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The floor the README promises, and the current LTS.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The video renderer draws text as outlines from a real font file and
      # fails rather than emitting blank boxes, so the runner needs one at a
      # path it looks in. ffmpeg itself arrives via npm, not apt.
      - name: Install a font for the video tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      # `npm ci` rather than `npm install`: CI should fail on a lockfile that
      # has drifted from package.json rather than quietly repairing it.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
